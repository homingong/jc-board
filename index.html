<!doctype html>
<meta charset="utf-8">
<title>청춘대길 관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 한 손 조작 — 위에 검색·조건 고정, 아래로 통신사별 순위 카드가 길게 흐른다 */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#15201b; --muted:#5d6a64; --line:#d7dfdb;
  --accent:#0d6b4d; --accent-soft:#dcefe6; --accent-ink:#ffffff; --warn:#b4231b;
  --sk:#c2410c; --kt:#1f4fbf; --lg:#9d174d; --top:#fff7e0; --top-line:#e9c46a;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18211d; --ink:#e6eeea; --muted:#9aa8a1; --line:#2b3732;
  --accent:#4fbf93; --accent-soft:#1d3a2f; --accent-ink:#0b1410; --warn:#ff7b72;
  --sk:#fb8a5c; --kt:#7aa2ff; --lg:#f472b6; --top:#2b2614; --top-line:#8a6d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18211d; --ink:#e6eeea; --muted:#9aa8a1; --line:#2b3732;
  --accent:#4fbf93; --accent-soft:#1d3a2f; --accent-ink:#0b1410; --warn:#ff7b72;
  --sk:#fb8a5c; --kt:#7aa2ff; --lg:#f472b6; --top:#2b2614; --top-line:#8a6d1f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ── 잠금 화면 ── */
#lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:32px}
.brand{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:500}
#lock h1{margin:0;font-size:22px;text-wrap:balance;text-align:center}
.lockhint{margin:0;color:var(--muted);font-size:14px;text-align:center}
.dots{display:flex;gap:16px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots span.on{background:var(--ink);border-color:var(--ink)}
.dots.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lockmsg{min-height:1.4em;margin:0;font-size:14px;color:var(--warn);text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;font-family:var(--f-num)}
.pad button:active{background:var(--accent-soft)}
.pad button.txt{font-family:var(--f-body);font-size:14px;color:var(--muted);border-color:transparent;background:transparent}
.pad button:focus-visible,.chip:focus-visible,.seg button:focus-visible,#q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 검색 화면 ── */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px 8px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.car-seg{margin-top:0;flex:none}
.car-seg button{height:34px;padding:0 14px;font-weight:700}
.car-seg button[data-k="SK"][aria-pressed="true"]{background:var(--sk);border-color:var(--sk)}
.car-seg button[data-k="KT"][aria-pressed="true"]{background:var(--kt);border-color:var(--kt)}
.car-seg button[data-k="LG"][aria-pressed="true"]{background:var(--lg);border-color:var(--lg)}
.toprow b{font-size:16px}
.basis{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3}
.basis em{font-style:normal;color:var(--warn);font-weight:700}
.searchbox{display:flex;gap:8px}
#q{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
#q:focus{border-color:var(--accent);outline:none}
#clr{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.hot button{border-color:var(--accent);color:var(--accent);font-weight:500}
.hot button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sub{background:var(--accent-soft);border-radius:10px;padding:6px;margin-top:6px;flex-wrap:wrap;overflow:visible}
.sub button{height:30px;font-size:13.5px;border-color:transparent}
.sub button[aria-pressed="true"]{background:var(--surface);border-color:var(--accent);color:var(--ink);font-weight:700}
.seg button small,.chip small{font-size:11px;font-weight:400;opacity:.75;margin-left:5px}
.seglabel{flex:none;align-self:center;font-size:12px;color:var(--muted);padding-right:2px}

main{padding-block:12px 40px;display:flex;flex-direction:column;gap:18px}
.sug h2,.car h2{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px}
.chip:active{background:var(--accent-soft)}

.car h2{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:0}
.car h2 i{font-style:normal;font-size:12px;font-weight:700;color:var(--surface);padding:2px 7px;border-radius:5px}
.car h2 small{font-size:12px;color:var(--muted);font-weight:400}
.car[data-c="SK"] h2 i{background:var(--sk)} .car[data-c="KT"] h2 i{background:var(--kt)} .car[data-c="LG"] h2 i{background:var(--lg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;row-gap:2px;padding:11px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.first{background:var(--top)}
.rk{grid-column:1;grid-row:1/span 3;font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--muted);padding-top:2px}
.row.first .rk{color:var(--ink)}
.dl{grid-column:2;grid-row:1;font-weight:700;font-size:16px;min-width:0}
.tot{grid-column:3;grid-row:1/span 2;text-align:right;font-family:var(--f-num);font-weight:600;font-size:24px;line-height:1.1}
.tot small{font-size:12px;color:var(--muted);font-weight:500;margin-left:1px}
.parts{grid-column:2;grid-row:2;font-size:13px;color:var(--muted);min-width:0}
.parts b{color:var(--ink);font-weight:500;font-family:var(--f-num)}
.req{grid-column:2/span 2;grid-row:4;font-size:12.5px;font-weight:700;color:var(--warn);min-width:0;overflow-wrap:anywhere}
.meta{grid-column:2/span 2;grid-row:3;font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.meta .hd{color:var(--ink)}
.empty{padding:14px 12px;color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{border:0;background:none;color:var(--accent);padding:0;font-size:12px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.dots.bad{animation:none}}

/* ── 탭 (2026-10-23): 단가 검색 + 글로 된 정책 ── */
.tabs{display:flex;gap:2px;margin:-2px 0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;height:36px;padding:0 11px;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tabs button small{font-size:11px;font-family:var(--f-num);margin-left:3px;opacity:.7}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tcards{display:flex;flex-direction:column;gap:8px}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.tc .hd1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tc .dl2{font-weight:700;font-size:15px}
.tc .tg{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px}
.tc .tg.w{color:var(--warn);background:transparent;border:1px solid currentColor}
.tc .am{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:17px;white-space:nowrap}
.tc .am.tx{font-family:var(--f-body);font-size:14px;color:var(--warn)}
.tc .tt{margin-top:4px;font-size:15px;font-weight:500;overflow-wrap:anywhere}
.tc .ln{margin-top:3px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tc .bd{margin-top:6px;font-size:13.5px;color:var(--ink);overflow-wrap:anywhere;white-space:pre-line}
.tc .bd.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.tc .more{border:0;background:none;padding:4px 0 0;font-size:13px;color:var(--accent)}
.tc .kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-top:6px;font-size:14px}
.tc .kv b{font-weight:700;text-align:right;white-space:nowrap}
.tc .kv small{grid-column:1/span 2;font-size:12px;color:var(--muted);margin-top:-1px;margin-bottom:3px}
.cgrp{margin:6px 0 2px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.cgrp i{font-style:normal;font-size:12px;font-weight:700;color:var(--surface);padding:2px 7px;border-radius:5px}
.cgrp[data-c="SK"] i{background:var(--sk)} .cgrp[data-c="KT"] i{background:var(--kt)} .cgrp[data-c="LG"] i{background:var(--lg)}
/* ── 요금제별 (2026-10-24) ── */
#planctl{margin-top:8px;background:var(--accent-soft);border-radius:10px;padding:7px 8px}
/* 2026-10-24 대표: 요금제 판이 화면을 다 덮어 단가가 안 보임 → 평소엔 한 줄(고른 요금제)만, 누르면 펼침 · 이 탭은 머리 고정 해제 */
body.plantab header{position:static}
#pbar{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:2px 0;text-align:left;font-size:13.5px;color:var(--ink)}
#pbar .pv{flex:1;min-width:0;line-height:1.45}
#pbar .pv b{font-weight:700}
#pbar .pv small{color:var(--muted);font-size:11.5px;margin-left:3px}
#pbar .tg2{flex:none;font-size:12.5px;color:var(--accent);font-weight:700;white-space:nowrap}
#pbody[hidden]{display:none}
#pbody{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
#planctl .pcars{display:flex;gap:6px;align-items:center}
#planctl .pcars button{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700}
#planctl .pcars button[aria-pressed="true"][data-pc="SK"]{background:var(--sk);border-color:var(--sk);color:#fff}
#planctl .pcars button[aria-pressed="true"][data-pc="KT"]{background:var(--kt);border-color:var(--kt);color:#fff}
#planctl .pcars button[aria-pressed="true"][data-pc="LG"]{background:var(--lg);border-color:var(--lg);color:#fff}
#pq{width:100%;height:38px;margin-top:6px;border:1.5px solid var(--line);border-radius:9px;padding:0 10px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
#pq:focus{border-color:var(--accent);outline:none}
.plist{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;max-height:132px;overflow-y:auto}
.plist button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13.5px;text-align:left}
.plist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.plist button small{font-size:11px;opacity:.75;margin-left:4px}
.pnow{margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.5}
.pnow b{color:var(--ink)}
.band{display:inline-block;font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 6px;margin-left:6px;font-weight:500;vertical-align:1px}
.prep{padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.prep b{color:var(--ink);font-weight:500}
.pnote{font-size:12px;color:var(--muted);margin:-8px 0 0}
mark{background:var(--top);color:inherit;border-radius:3px;padding:0 1px}
/* ── 대표·이사 전용 (2026-10-25) ── */
#pwf{display:flex;gap:8px;width:min(340px,100%)}
#pw{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:17px;background:var(--surface);color:var(--ink)}
#pw:focus{border-color:var(--accent);outline:none}
#pwf button{flex:none;height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.rem{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.chap{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.chap button{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px}
.chap button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chap select{margin-left:auto;max-width:52%;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;padding:0 8px}
.chap .old{color:var(--warn);font-weight:700;font-size:12px}
#mctl{margin-top:8px;background:var(--top);border:1px solid var(--top-line);border-radius:10px;padding:8px}
#mctl .g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#mctl label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}
#mctl input,#mctl select{height:38px;border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
#mctl .h{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}
@media (max-width:420px){#mctl .g{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mg{font-family:var(--f-num);font-weight:600}
.mg.neg{color:var(--warn)}
#tkctl{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#tkctl select{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;padding:0 8px}
#tkctl label{font-size:13px;display:flex;gap:4px;align-items:center}
.tksum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.tksum b{font-family:var(--f-num)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.tk .t1{display:flex;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.tk .t1 span{font-weight:400;color:var(--muted)}
.tk .t2{color:var(--muted);margin-top:2px}
.tk .t3{margin-top:4px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.tk .t3 b{font-family:var(--f-num);font-weight:600}
.tk .bad{color:var(--warn)}
/* ── 지난 단가 (2026-11-02 대표: 최근 3개월 · 월·날짜를 골라 보기) ── */
#hbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;height:28px;padding:0 11px;font-size:12.5px;color:var(--accent);font-weight:700}
#hbtn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
#hpanel{background:var(--accent-soft);border-radius:10px;padding:8px;margin-bottom:8px}
#hpanel .hmons{display:flex;gap:6px}
#hpanel .hmons button{flex:1;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700}
#hpanel .hmons button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px;text-align:center}
.hcal .wd{font-size:11px;color:var(--muted);padding-bottom:2px}
.hcal .wd:first-child{color:var(--warn)}
.hcal button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-num);font-size:14px;padding:0}
.hcal button:disabled{background:transparent;border-color:transparent;color:var(--muted);opacity:.45}
.hcal button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.hcal button small{display:block;font-size:9.5px;line-height:1;margin-top:-1px;opacity:.75;font-family:var(--f-body)}
.hchas{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hchas button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13.5px}
.hchas button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.hchas button small{font-size:11px;opacity:.75;margin-left:4px}
.hmsg{margin-top:8px;font-size:13px;color:var(--muted)}
.hmsg.bad{color:var(--warn)}
.hnow{margin-top:8px;width:100%;height:34px;border-radius:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;font-size:13.5px}
#hbanner{display:flex;align-items:center;gap:8px;background:var(--top);border:1px solid var(--top-line);border-radius:10px;padding:7px 10px;margin-bottom:8px;font-size:13px}
#hbanner b{color:var(--warn)}
#hbanner span{flex:1;min-width:0}
#hbanner small{color:var(--muted);font-size:11.5px}
#hbanner button{flex:none;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:14px;height:28px;padding:0 10px;font-size:12.5px;font-weight:700}
#hbtn{margin-left:auto}
</style>

<div id="lock" class="wrap">
  <div class="brand">청춘대길 · 대표·이사 전용</div>
  <h1>비밀번호</h1>
  <form id="pwf" autocomplete="on"><input id="pw" type="password" autocomplete="current-password" aria-label="비밀번호"><button>열기</button></form>
  <label class="rem"><input type="checkbox" id="rem" checked> 이 기기에서 기억</label>
  <p id="lockmsg" role="status"></p>
</div>

<div id="app" hidden>

const BLOB = {made: META.made};
const TYPES = ["MNP공시","MNP선약","기변공시","기변선약","010공시","010선약","전체"];
const CAPS = ["전체","기본","512G","1T"];
const CARS = ["SK","KT","LG"];
const LS = "admpw_" + META.salt.slice(0, 8);
const $ = s => document.querySelector(s);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},
               set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
               del(k){try{localStorage.removeItem(k)}catch(e){}}};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

let KEY = null, LIST = [], TK = null, CUR = "now";
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(META.salt), iterations:META.iter, hash:"SHA-256"},
                                 base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function openBytes(u8){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8.slice(0,12)}, KEY, u8.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function fetchBin(p){
  const r = await fetch(p + "?v=" + encodeURIComponent(META.made), {cache:"no-store"});
  if(!r.ok) throw new Error("불러오기 실패 " + p);
  return new Uint8Array(await r.arrayBuffer());
}
/* ── 잠금 ── */
let busy = false;
async function tryPw(pw, silent){
  busy = true; $("#lockmsg").style.color = "var(--muted)"; if(!silent) $("#lockmsg").textContent = "여는 중…";
  try{
    KEY = await derive(pw);
    LIST = await openBytes(b64(META.list));                 // 비밀번호 확인
    if($("#rem").checked) store.set(LS, pw); else store.del(LS);
    const data = await openBytes(await fetchBin("c/now.bin"));
    fillCha(); start(data);
  }catch(e){
    KEY = null; store.del(LS);
    if(!silent){ $("#lockmsg").style.color = ""; $("#lockmsg").textContent = /불러오기/.test(e.message) ? e.message : "비밀번호가 맞지 않습니다."; }
    else $("#lockmsg").textContent = "";
  }
  busy = false;
}
$("#pwf").addEventListener("submit", e => { e.preventDefault(); if(!busy && $("#pw").value) tryPw($("#pw").value); });
if(!window.crypto || !crypto.subtle) $("#lockmsg").textContent = "이 브라우저에서는 열 수 없습니다. 사파리나 크롬으로 열어 주세요.";
else { const saved = store.get(LS); if(saved) tryPw(saved, true); }
/* ── 지난 차수: 월·날짜로 고르기 (2026-11-02 대표 — 현장 정책검색과 같은 화면) ──
   LIST id = YYYYMMDD_HHMM_차수_해시 (보관 파일 저장 시각) · label = "10/31 50차 (18시 기준)" */
const H = {mon:"", day:"", busy:false, open:false};
const WD = ["일","월","화","수","목","금","토"];
function fillCha(){
  for(const x of LIST){ x.d = x.id.slice(0,4) + "-" + x.id.slice(4,6) + "-" + x.id.slice(6,8); x.t = x.id.slice(9,11) + ":" + x.id.slice(11,13);
    const m = /(\d+)차/.exec(x.label), h = /(\d+시(?:\d+분)?) 기준/.exec(x.label), g = /차 ([가-힣]+변경)/.exec(x.label);
    x.cha = m ? m[1] : ""; x.h = h ? h[1] : ""; x.tag = g ? g[1] : ""; }
  H.mons = [...new Set(LIST.map(x => x.d.slice(0,7)))].sort();
  H.mon = H.mon || H.mons[H.mons.length-1] || "";
}
const hdate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const hlabel = x => { const dt = hdate(x.d); return `${dt.getMonth()+1}/${dt.getDate()}(${WD[dt.getDay()]}) ` + (x.cha ? x.cha + "차" : "") + (x.tag ? " " + x.tag : "") + (x.h ? ` · ${x.h} 기준` : ` · ${x.t}`); };
function hmsg(t, bad){ $("#hmsg").textContent = t || ""; $("#hmsg").classList.toggle("bad", !!bad); }
function hrender(){
  $("#hmons").innerHTML = (H.mons || []).map(m => `<button data-hmon="${m}" aria-pressed="${m === H.mon}">${+m.slice(5)}월</button>`).join("");
  if(!H.mon){ $("#hcal").innerHTML = ""; $("#hchas").innerHTML = ""; hmsg("지난 차수가 없습니다."); return; }
  const [y, m] = H.mon.split("-").map(Number);
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0).getDate(), has = {};
  for(const x of LIST) if(x.d.startsWith(H.mon)) (has[+x.d.slice(8)] = has[+x.d.slice(8)] || []).push(x);
  let g = WD.map(w => `<div class="wd">${w}</div>`).join("") + "<div></div>".repeat(first.getDay());

  $("#pbody").hidden = !popen; $("#pbar").setAttribute("aria-expanded", popen); $("#ptg").textContent = popen ? "접기 ▴" : "바꾸기 ▾";
  $("#pnow").innerHTML = CARS.filter(k => st.car === "전체" || st.car === k).map(k => `${k} <b>${esc(PL.plans[st.plan[k]][0])}</b>`).join(" · ") +
    (q ? "" : ` <span>· 대표 요금제 = 최근 60일 개통 많은 순</span>`);
}
function planResults(f){
  const PL = D.plan, exact = D.modelSet.has(st.q.trim()); let html = "";
  for(const c of CARS.filter(c => st.car === "전체" || st.car === c)){
    const pi = st.plan[c], P0 = PL.plans[pi], bl = PL.bands[c];
    const best = new Map(), prep = new Map();
    for(const r of D.rows){ if(r.c !== c || !f(r)) continue;
      const b = bandOf(c, r.dl, pi), bi = bl.indexOf(b);
      const v = (bi >= 0 && r.pv) ? r.pv[bi] : 0;
      if(!v){ if(!best.has(r.dl)) prep.set(r.dl, b); continue; }
      const tot = v[0] + v[1] + v[2], x = best.get(r.dl);
      if(!x || tot > x.tot) best.set(r.dl, {r, b, face:v[0], hid:v[1], add:v[2], hd:PL.hds[v[3]] || "", tot});
    }
    for(const k of best.keys()) prep.delete(k);
    const rs = [...best.values()].sort((a,b) => b.tot - a.tot);
    html += `<section class="car" data-c="${c}"><h2><i>${c}</i>${esc(P0[0])}<small>${P0[2]}${rs.length ? ` · ${rs.length}곳` : ""}</small></h2><div class="list">`;
    if(!rs.length && !prep.size) html += `<div class="empty">이 조건에 맞는 ${c} 정책이 없습니다.</div>`;
    rs.forEach((x,i) => {
      const r = x.r, tags = [];
      if(!exact) tags.push(esc(r.v) + (D.petOf[r.v] ? " " + esc(D.petOf[r.v]) : ""));
      else if(r.cap !== "기본") tags.push(r.cap);
      if(st.type === "전체") tags.push(r.type);
      html += `<div class="row${i===0?" first":""}"><div class="rk">${i+1}</div>
        <div class="dl">${esc(r.dl)}<span class="band">${esc(x.b)} 칸</span></div><div class="tot">${fmt(x.tot)}<small>만</small></div>
        <div class="parts">액면 <b>${fmt(x.face)}</b> · 히든 <b>${fmt(x.hid)}</b> · 부가 <b>${fmt(x.add)}</b></div>
        ${(tags.length || x.hd) ? `<div class="meta">${tags.length ? tags.join(" · ") + (x.hd ? " — " : "") : ""}${x.hd ? `<span class="hd">${esc(x.hd)}</span>` : ""}</div>` : ""}
        ${r.req >= 0 && D.reqs ? `<div class="req">⚠ ${esc(D.reqs[r.req])}</div>` : ""}
      </div>`;
    });
    if(prep.size) html += `<div class="prep">준비 중 · <b>${[...prep.keys()].map(esc).join(" · ")}</b> — 이 요금제 구간이 원장과 아직 대조되지 않았습니다. 거래처에 문의해 주세요.</div>`;
    html += `</div></section>`;
  }
  return html + `<p class="pnote">요금제별 단가는 공지 단가와 같은 계산(액면+히든+부가)을 그 요금제 구간 칸에 적용한 값입니다. 공지 단가와 다를 수 있습니다.</p>`;
}
function render(){
  buildTabs();
  $("#mctl").hidden = st.tab !== "마진"; $("#tkctl").hidden = st.tab !== "텔킷";
  if(st.tab === "텔킷"){ document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === st.tab));
    document.querySelectorAll("#cars button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === st.car)); renderTk(); return; }
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === st.tab));
  document.querySelectorAll("#cars button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === st.car));
  const isP = isPriceTab();
  $("#pricectl").hidden = !isP; if(isP) $("#dls").hidden = true;
  $("#planctl").hidden = st.tab !== "요금제"; if(st.tab === "요금제") renderPlanCtl();
  document.body.classList.toggle("plantab", st.tab === "요금제");
  $("#q").placeholder = isP ? PH : "단어로 찾기 (거래처·모델·USIM 등)";
  if(!isP){ renderTxt(); return; }
  const q0 = st.q.trim();
  const fi = D.fams.findIndex(f => f.members.some(m => m[0] === q0));
  document.querySelectorAll("#hot button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.f === fi));
  const sub = $("#sub");
  if(fi >= 0 && D.fams[fi].members.length > 1){
    if(sub.dataset.f !== String(fi)){
      sub.innerHTML = D.fams[fi].members.map(m => `<button data-m="${esc(m[0])}">${esc(m[0])}<small>${esc(m[1])}</small></button>`).join("");
      sub.dataset.f = fi;
    }
    sub.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === q0));
    sub.hidden = false;
  } else { sub.hidden = true; sub.dataset.f = ""; }
  document.querySelectorAll("#cars button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === st.car));
  document.querySelectorAll("#types button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === st.type));
  document.querySelectorAll("#caps button").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === st.cap));
  const f = matchFn(); let html = "";
  if(f && st.tab === "요금제"){ html = planResults(f); }
  else if(f && st.tab === "마진"){ html = marginResults(f); }
  else if(f){
    const exact = D.modelSet.has(st.q.trim());
    for(const c of CARS.filter(c => st.car === "전체" || st.car === c)){
      const best = new Map();
      for(const r of D.rows){ if(r.c !== c || !f(r)) continue;
        const b = best.get(r.dl); if(!b || r.tot > b.tot) best.set(r.dl, r); }
      const rs = [...best.values()].sort((a,b) => b.tot - a.tot);
      html += `<section class="car" data-c="${c}"><h2><i>${c}</i>${rs.length ? `<small>${rs.length}곳 · 합계 높은 순</small>` : ""}</h2><div class="list">`;
      if(!rs.length){
        // 고른 용량(512G·1T)이 이 통신사 원장엔 따로 없고 기본 용량만 있는 경우
        const hasBase = st.cap !== "전체" && st.cap !== "기본" &&
                        D.rows.some(r => r.c === c && r.cap === "기본" && (exact ? r.v === st.q.trim() : r.s.includes(st.q.trim().toLowerCase())));
        html += hasBase
          ? `<div class="empty">${c}는 ${st.cap} 단가가 따로 없습니다. <button class="chip" data-c2="기본">기본 용량 단가 보기</button></div>`
          : `<div class="empty">이 조건에 맞는 ${c} 정책이 없습니다.</div>`;
      }
      rs.forEach((r,i) => {
        const tags = [];
        if(!exact) tags.push(esc(r.v) + (D.petOf[r.v] ? " " + esc(D.petOf[r.v]) : ""));
        else if(r.cap !== "기본") tags.push(r.cap);
        if(st.type === "전체") tags.push(r.type);
        html += `<div class="row${i===0?" first":""}"><div class="rk">${i+1}</div>
          <div class="dl">${esc(r.dl)}</div><div class="tot">${fmt(r.tot)}<small>만</small></div>
          <div class="parts">액면 <b>${fmt(r.face)}</b> · 히든 <b>${fmt(r.hid)}</b> · 부가 <b>${fmt(r.add)}</b></div>
          ${(tags.length || r.hd) ? `<div class="meta">${tags.length ? tags.join(" · ") + (r.hd ? " — " : "") : ""}${r.hd ? `<span class="hd">${esc(r.hd)}</span>` : ""}</div>` : ""}
          ${r.req >= 0 && D.reqs ? `<div class="req">⚠ ${esc(D.reqs[r.req])}</div>` : ""}
        </div>`;
      });
      html += `</div></section>`;
    }
  }
  const sg = suggestions();
  html = (f ? html + (sg ? sg : "") : sg) +
    `<div class="foot"><span>단위 만원 · ${esc(BLOB.made)} 생성</span><button id="lockbtn">잠그기</button></div>`;
  $("#out").innerHTML = html;
}
document.addEventListener("click", e => {
  const mb = e.target.closest(".tc .more");
  if(mb){ const bd = mb.previousElementSibling; const open = bd.classList.toggle("clamp"); mb.textContent = open ? "더 보기" : "접기"; return; }
  const t = e.target.closest("[data-t]"), c = e.target.closest("#caps [data-c]"), m = e.target.closest("[data-m]"),
        fb = e.target.closest("#hot [data-f]");
  const c2 = e.target.closest("[data-c2]");
  const kb = e.target.closest("#cars [data-k]");
  const tb = e.target.closest("#tabs [data-tab]"), db = e.target.closest("#dls [data-dl]"), chb = e.target.closest("#chap [data-ch]");
  if(chb){ st.ch = chb.dataset.ch; st.tab = st.ch === "마진" ? "마진" : "단가"; $("#q").value = st.q; save(); render(); return; }
  const pc = e.target.closest("#pcars [data-pc]"), pb = e.target.closest("#plist [data-pi]"), pbar = e.target.closest("#pbar");
  if(pbar){ popen = !popen; if(!popen){ st.pq = ""; $("#pq").value = ""; } }
  else if(pc){ st.pcar = pc.dataset.pc; st.pq = ""; $("#pq").value = ""; }
  else if(pb){ st.plan[st.pcar] = +pb.dataset.pi; st.pq = ""; $("#pq").value = ""; $("#pq").blur(); popen = false;
              requestAnimationFrame(() => { const o = $("#out"); if(o) window.scrollTo({top: o.offsetTop - 8}); }); }
  else if(tb){ st.tab = tb.dataset.tab; $("#q").value = isPriceTab() ? st.q : st.tq; window.scrollTo({top:0}); }
  else if(db){ st.dl = db.dataset.dl; }
  else if(kb){ st.car = kb.dataset.k; try{ localStorage.setItem("pccar", st.car); }catch(err){} }
  else if(c2){ st.cap = c2.dataset.c2; }
  else if(fb){ st.q = D.fams[+fb.dataset.f].members[0][0]; $("#q").value = st.q; $("#q").blur(); window.scrollTo({top:0}); }
  else if(t){ st.type = t.dataset.t; } else if(c){ st.cap = c.dataset.c; }
  else if(m){ st.q = m.dataset.m; $("#q").value = st.q; $("#q").blur(); window.scrollTo({top:0}); }
  else if(e.target.id === "clr"){ if(isPriceTab()) st.q = ""; else st.tq = ""; $("#q").value = ""; $("#q").focus(); }
  else if(e.target.id === "lockbtn"){ store.del(LS); location.reload(); return; }
  else return;
  save(); render();
});
for(const [k,id] of [["P","m_free"],["A","m_add"],["S","m_sun"],["T","m_dae"]])
  $("#"+id).addEventListener("input", e => { st.mg[k] = e.target.value; save(); render(); });
$("#m_sub").addEventListener("change", e => { st.mg.sub = e.target.value; save(); render(); });
$("#pq").addEventListener("input", e => { st.pq = e.target.value; renderPlanCtl(); });
$("#q").addEventListener("input", e => { if(isPriceTab()) st.q = e.target.value; else st.tq = e.target.value; save(); render(); });
</script>
